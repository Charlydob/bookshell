name: Bookshell PWA zoom regression

on:
  pull_request:
    paths:
      - "beta-clean/index.html"
      - "beta-clean/tests/pwa-zoom.test.mjs"
      - ".github/workflows/pwa-zoom-tests.yml"
  workflow_dispatch:

jobs:
  pwa-zoom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify installed-PWA zoom behavior
        run: node --test beta-clean/tests/pwa-zoom.test.mjs
